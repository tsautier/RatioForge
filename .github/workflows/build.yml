name: Build RatioForge

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Source/RatioForge.sln
      - name: Build
        run: dotnet build Source/RatioForge.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test Source/RatioForge.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Coverage summary
        if: matrix.os == 'ubuntu-24.04'
        shell: pwsh
        run: |
          # Each test project reports separately; keep the best measurement per assembly.
          $rows = foreach ($report in Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml) {
            [xml]$coverage = Get-Content $report.FullName -Raw
            foreach ($package in $coverage.coverage.packages.package) {
              [pscustomobject]@{
                Assembly = $package.name
                Line = [Math]::Round([double]$package.'line-rate' * 100, 1)
                Branch = [Math]::Round([double]$package.'branch-rate' * 100, 1)
              }
            }
          }
          "### Code coverage (best test suite per assembly)" >> $env:GITHUB_STEP_SUMMARY
          "| Assembly | Line coverage | Branch coverage |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | ---: | ---: |" >> $env:GITHUB_STEP_SUMMARY
          foreach ($group in $rows | Group-Object Assembly | Sort-Object Name) {
            $best = $group.Group | Sort-Object Line -Descending | Select-Object -First 1
            "| $($best.Assembly) | $($best.Line) % | $($best.Branch) % |" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 14

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Audit NuGet dependencies
        shell: pwsh
        run: ./build/Test-NuGetSecurity.ps1

  package:
    name: Package ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish and smoke check
        shell: pwsh
        run: ./build/Publish-Desktop.ps1 -Runtime ${{ matrix.runtime }}
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: RatioForge-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/RatioForge-*-linux-x64
            artifacts/RatioForge-*-linux-x64-lite
            artifacts/RatioForge-*-osx-x64
            artifacts/RatioForge-*-osx-x64-lite
            artifacts/RatioForge-*-osx-arm64
            artifacts/RatioForge-*-osx-arm64-lite
            artifacts/*.sha256
            artifacts/*.metrics.json
          if-no-files-found: error
          retention-days: 14
