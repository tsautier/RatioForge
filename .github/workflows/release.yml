name: Release RatioForge

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "version.txt must contain a SemVer core version. Current value: '$version'"
          }

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Git tag '$env:GITHUB_REF_NAME' does not match version.txt value 'v$version'."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore Source/RatioForge.sln

      - name: Audit NuGet dependencies
        shell: pwsh
        run: ./build/Test-NuGetSecurity.ps1

      - name: Build
        run: dotnet build Source/RatioForge.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Source/RatioForge.sln --no-build --configuration Release --verbosity normal

      - name: Publish self-contained win-x64
        run: dotnet publish Source/RatioForge/RatioForge.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64

      - name: Publish Lite win-x64
        run: dotnet publish Source/RatioForge/RatioForge.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64-lite

      - name: Smoke check Windows release build
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $executables = @(
            @{
              Source = "artifacts/RatioForge-$version-win-x64/RatioForge.exe"
              Destination = "artifacts/RatioForge-$version-win-x64.exe"
              MaximumBytes = 100MB
            },
            @{
              Source = "artifacts/RatioForge-$version-win-x64-lite/RatioForge.exe"
              Destination = "artifacts/RatioForge-$version-win-x64-lite.exe"
              MaximumBytes = 10MB
            }
          )

          foreach ($item in $executables) {
            if (!(Test-Path $item.Source)) {
              throw "Missing GUI executable: $($item.Source)"
            }

            $file = Get-Item $item.Source
            if ($file.VersionInfo.FileVersion -ne "$version.0") {
              throw "Expected file version '$version.0', got '$($file.VersionInfo.FileVersion)' for $($item.Source)"
            }

            if ($file.Length -gt $item.MaximumBytes) {
              throw "$($item.Source) is $($file.Length) bytes; expected at most $($item.MaximumBytes)."
            }

            $process = Start-Process -FilePath $file.FullName -PassThru
            try {
              Start-Sleep -Seconds 5
              if ($process.HasExited) {
                throw "$($item.Source) exited during the startup smoke check with code $($process.ExitCode)."
              }
            }
            finally {
              if (!$process.HasExited) {
                Stop-Process -Id $process.Id -Force
              }
            }

            Copy-Item -LiteralPath $file.FullName -Destination $item.Destination -Force
          }

      - name: Package release artifact
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64/*" `
            -DestinationPath "artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64.zip" `
            -Force

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $files = @(
            "artifacts/RatioForge-$version-win-x64.zip",
            "artifacts/RatioForge-$version-win-x64.exe",
            "artifacts/RatioForge-$version-win-x64-lite.exe"
          )

          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash -Algorithm SHA256 -Path $file
            "$($hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($file))"
          }

          $checksums | Set-Content -Encoding ascii "artifacts/RatioForge-$version-win-x64.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: RatioForge-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64.exe
            artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64-lite.exe
            artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64.zip" `
            "artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64.exe" `
            "artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64-lite.exe" `
            "artifacts/RatioForge-${{ steps.version.outputs.version }}-win-x64.sha256" `
            --title "RatioForge ${{ steps.version.outputs.version }}" `
            --notes "See CHANGELOG.md for the release notes." `
            --verify-tag

      - name: Verify GitHub release assets
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $expectedAssets = @(
            "RatioForge-$version-win-x64.zip",
            "RatioForge-$version-win-x64.exe",
            "RatioForge-$version-win-x64-lite.exe",
            "RatioForge-$version-win-x64.sha256"
          )

          $release = gh release view "$env:GITHUB_REF_NAME" --json assets | ConvertFrom-Json
          foreach ($assetName in $expectedAssets) {
            $asset = $release.assets | Where-Object { $_.name -eq $assetName }
            if ($null -eq $asset) {
              throw "Missing release asset: $assetName"
            }

            if ($asset.size -le 0) {
              throw "Release asset is empty: $assetName"
            }
          }

          New-Item -ItemType Directory -Path "release-verification" -Force | Out-Null
          foreach ($assetName in $expectedAssets) {
            gh release download "$env:GITHUB_REF_NAME" --pattern $assetName --dir "release-verification" --clobber
          }

          $checksumPath = "release-verification/RatioForge-$version-win-x64.sha256"
          foreach ($line in Get-Content $checksumPath) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Invalid checksum entry: $line"
            }

            $expectedHash = $Matches[1]
            $assetPath = Join-Path "release-verification" $Matches[2]
            if (!(Test-Path $assetPath)) {
              throw "Checksum references a missing release asset: $assetPath"
            }

            $actualHash = (Get-FileHash -Algorithm SHA256 -Path $assetPath).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              throw "SHA256 mismatch for $assetPath. Expected $expectedHash, got $actualHash."
            }
          }
