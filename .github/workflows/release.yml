name: Release RatioForge

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "version.txt must contain a SemVer core version. Current value: '$version'"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Git tag '$env:GITHUB_REF_NAME' does not match version.txt value 'v$version'."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore
        run: dotnet restore Source/RatioForge.sln
      - name: Audit NuGet dependencies
        shell: pwsh
        run: ./build/Test-NuGetSecurity.ps1
      - name: Build
        run: dotnet build Source/RatioForge.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test Source/RatioForge.sln --no-build --configuration Release --verbosity normal

  package:
    needs: validate
    name: Package ${{ matrix.runtime }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-15-intel
            runtime: osx-x64
          - os: macos-15
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish and smoke check
        shell: pwsh
        run: ./build/Publish-Desktop.ps1 -Runtime ${{ matrix.runtime }}
      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: RatioForge-${{ needs.validate.outputs.version }}-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.exe
            artifacts/RatioForge-*-linux-x64
            artifacts/RatioForge-*-linux-x64-lite
            artifacts/RatioForge-*-osx-x64
            artifacts/RatioForge-*-osx-x64-lite
            artifacts/RatioForge-*-osx-arm64
            artifacts/RatioForge-*-osx-arm64-lite
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: [validate, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download release candidates
        uses: actions/download-artifact@v8
        with:
          pattern: RatioForge-${{ needs.validate.outputs.version }}-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem artifacts -File | ForEach-Object { $_.FullName })
          if ($assets.Count -ne 16) {
            throw "Expected 16 release assets, found $($assets.Count)."
          }
          gh release create "$env:GITHUB_REF_NAME" @assets `
            --title "RatioForge ${{ needs.validate.outputs.version }}" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag
      - name: Verify uploaded assets and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          $runtimes = @("win-x64", "linux-x64", "osx-x64", "osx-arm64")
          $expected = foreach ($runtime in $runtimes) {
            $extension = if ($runtime -eq "win-x64") { ".exe" } else { "" }
            $archive = if ($runtime -eq "win-x64") { ".zip" } else { ".tar.gz" }
            "RatioForge-$version-$runtime$archive"
            "RatioForge-$version-$runtime$extension"
            "RatioForge-$version-$runtime-lite$extension"
            "RatioForge-$version-$runtime.sha256"
          }
          $release = gh release view "$env:GITHUB_REF_NAME" --json assets | ConvertFrom-Json
          foreach ($name in $expected) {
            $asset = $release.assets | Where-Object name -eq $name
            if ($null -eq $asset -or $asset.size -le 0) {
              throw "Missing or empty release asset: $name"
            }
          }
          New-Item -ItemType Directory -Path verification | Out-Null
          gh release download "$env:GITHUB_REF_NAME" --dir verification
          foreach ($checksum in Get-ChildItem verification -Filter *.sha256) {
            foreach ($line in Get-Content $checksum.FullName) {
              if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid checksum entry: $line" }
              $assetPath = Join-Path verification $Matches[2]
              if (!(Test-Path -LiteralPath $assetPath)) { throw "Checksum references missing asset: $assetPath" }
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath).Hash.ToLowerInvariant()
              if ($actual -ne $Matches[1]) { throw "SHA256 mismatch for $assetPath" }
            }
          }
